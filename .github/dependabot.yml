# Update PRs for the npm lockfile and workflow actions. Security updates are also enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # @vitest/* packages require the exact same vitest version, so they must move together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # Upgrade TypeScript majors deliberately, not as a routine bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
